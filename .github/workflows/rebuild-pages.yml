# Пересборка сайта, когда Dark Mode News Engine добавил новость или статью в src/data/feed.json.
# Собирает копию для GitHub Pages (npm run build:pages), кладёт её в корень main и просит Pages обновиться.
name: Rebuild site after new publications

on:
  push:
    branches: [main]
    paths: ["src/data/feed.json"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rebuild-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Commit the new build
        run: |
          git config user.name "Dark Mode News Engine"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Сайт пересобран: новые публикации"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Ask GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
